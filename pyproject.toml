[project]
name = "skillpulse"
version = "0.1.0"
description = "Job-market analyser over Hacker News 'Who is hiring?' threads"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nikos Litharis" }]
dependencies = [
    "httpx>=0.28",
    "SQLAlchemy>=2.0.45",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12",
    "alembic>=1.18",
    "celery[redis]>=5.4",
    "pyyaml>=6.0.3",
    "fastapi>=0.143.2",
]

[project.scripts]
skillpulse = "skillpulse.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "mypy>=1.15",
    "testcontainers[postgres]>=4.9",
    "respx>=0.22",
    "types-psycopg2>=2.9",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need Docker (testcontainers Postgres)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() is called in argument defaults by design.
"src/skillpulse/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/skillpulse"]
plugins = []

# Celery ships no py.typed marker, so its imports are untyped. Keep strict mode
# everywhere else; the tasks module only relaxes the decorator check that Celery's
# untyped @app.task would otherwise trip.
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["skillpulse.workers.app", "skillpulse.workers.tasks"]
disallow_untyped_decorators = false
