apiVersion: v1
kind: Service
metadata:
  name: skillpulse-api
  labels:
    {{- include "skillpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "skillpulse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP