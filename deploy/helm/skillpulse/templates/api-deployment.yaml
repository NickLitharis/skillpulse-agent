apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillpulse-api
  labels:
    {{- include "skillpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "skillpulse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "skillpulse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- include "skillpulse.podSecurityContext" . | nindent 6 }}
      containers:
        - name: api
          {{- include "skillpulse.image" . | nindent 10 }}
          command: ["uvicorn", "skillpulse.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
          securityContext:
            {{- include "skillpulse.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.apiSecret }}
          env:
            {{- include "skillpulse.commonEnv" (dict "Values" .Values "databaseSecret" .Values.apiSecret) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- include "skillpulse.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "skillpulse.tmpVolume" . | nindent 8 }}